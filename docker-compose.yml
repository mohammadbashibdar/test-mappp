services:
  server:
    build: .               
    container_name: server
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - gis-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: tail -f /dev/null

  db:
    image: postgis/postgis:17-3.4
    container_name: db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gis_backend
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - gis-network
    dns:
      - 8.8.8.8
      - 8.8.4.4

networks:
  gis-network:
    driver: bridge

volumes:
  db_data:
    driver: local
