services:
  server:
    image: python:latest
    container_name: server
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - gis-network
    command: tail -f /dev/null
  db:
    image: postgres:17
    container_name: db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gis_backend
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - gis-network

networks:
  gis-network:
    driver: bridge

volumes:  
  db_data:
    driver: local