<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS Map - Advanced Layers Management System</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Leaflet Draw for drawing and annotation -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <!-- Leaflet Measure for measurement tools -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.13.0/dist/leaflet-geoman.css" />
    <!-- Leaflet Browser Print for printing -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.browser.print/dist/leaflet.browser.print.min.css" />
    <!-- Leaflet Bookmarks -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-bookmarks@1.1.0/Leaflet.Bookmarks.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f4f4;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Toolbar inspired by QGIS/ArcGIS Pro */
        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 10px;
            z-index: 2000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .toolbar-group {
            display: flex;
            gap: 5px;
            margin-right: 15px;
        }

        .tool-btn {
            background: transparent;
            border: none;
            padding: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            color: #333;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .tool-btn:hover {
            background: #f0f0f0;
        }

        .tool-btn.active {
            background: #e0e0e0;
        }

        /* Container adjusted for toolbar */
        .container {
            display: flex;
            height: 100vh;
            flex-direction: row;
        }

        /* Sidebar - Layers Panel on Left */
        .sidebar {
            width: 300px;
            background: #ffffff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 15px;
            background: #f0f0f0;
            border-bottom: 1px solid #ddd;
            text-align: center;
            font-weight: bold;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #333;
        }

        .layer-list {
            border: 1px solid #ddd;
            background: white;
            max-height: 400px;
            overflow-y: auto;
        }

        .layer-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: move;
        }

        .layer-checkbox {
            margin-right: 10px;
        }

        .layer-info {
            flex: 1;
        }

        .opacity-slider {
            width: 60px;
            margin-left: 10px;
        }

        .layer-actions {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #666;
        }

        /* Map Container */
        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Bottom Status Bar */
        .status-bar {
            position: absolute;
            bottom: 0;
            right: 0;
            background: rgba(255,255,255,0.9);
            padding: 5px 15px;
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            z-index: 1000;
            border-top-left-radius: 5px;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        }

        .status-item {
            color: #333;
        }

        /* Zoom Controls */
        .leaflet-control-zoom {
            top: 60px !important;
        }

        .leaflet-pm-toolbar {
            margin-top: 50px !important; /* Adjust this value (e.g., 50px-100px) based on how much space you need to clear the zoom buttons */
        }
        .leaflet-top .leaflet-control {
            margin-top: 0 !important; /* Set to 0 for no gap, or 5px for a small one */
        }
        /* Notification, Loading same as before */
        .notification {
            position: fixed;
            top: 60px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            z-index: 3000;
            transition: opacity 0.3s;
            opacity: 0;
        }

        .notification.show {
            opacity: 1;
        }

        .notification.error {
            background: #f44336;
        }

        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Attribute Table Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 3000;
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 20px;
            width: 80%;
            max-height: 80%;
            overflow-y: auto;
            border-radius: 4px;
        }

        .close-btn {
            float: right;
            cursor: pointer;
            font-size: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #f0f0f0;
        }
    </style>
</head>

<body>
    <!-- Top Toolbar -->
    <div class="toolbar">
        <div class="toolbar-group">
            <button class="tool-btn" onclick="resetMapView()" title="Reset Map"><i class="fas fa-home"></i></button>
            <button class="tool-btn" onclick="toggleMeasure()" title="Measure"><i class="fas fa-ruler"></i></button>
            <button class="tool-btn" onclick="toggleDraw()" title="Draw"><i class="fas fa-pencil-alt"></i></button>
            <button class="tool-btn" onclick="printMap()" title="Print/Export"><i class="fas fa-print"></i></button>
            <button class="tool-btn" onclick="toggleIdentify()" title="Identify"><i class="fas fa-info-circle"></i></button>
        </div>
    </div>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-map"></i> Map System
            </div>
            <div class="sidebar-content">
                <!-- Layer Management -->
                <div class="control-group">
                    <h3><i class="fas fa-layer-group"></i> Layers Management</h3>
                    <button class="btn btn-success" onclick="updateLayers()"><i class="fas fa-sync-alt"></i> Update Layers</button>
                    <button class="btn btn-info" onclick="selectAllLayers()"><i class="fas fa-check-square"></i> Select All</button>
                    <button class="btn btn-warning" onclick="deselectAllLayers()"><i class="fas fa-square"></i> Deselect All</button>
                </div>
                <!-- Layer List -->
                <div class="control-group">
                    <h3><i class="fas fa-list"></i> Layers List</h3>
                    <div class="layer-list" id="layerList"></div>
                </div>
            </div>
        </div>

        <!-- Map Container -->
        <div class="map-container">
            <div id="map"></div>
            <!-- Status Bar -->
            <div class="status-bar" id="statusBar">
                <span class="status-item" id="coordinates">Coordinate: -</span>
                <span class="status-item" id="zoomLevel">Magnifier: -</span>
                <span class="status-item" id="scale">Scale: -</span>
            </div>
            <!-- Loading -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>
            <!-- Notification -->
            <div class="notification" id="notification"></div>
            <!-- Attribute Modal -->
            <div class="modal" id="attributeModal">
                <div class="modal-content">
                    <span class="close-btn" onclick="closeModal()">&times;</span>
                    <h2>Attribute Table</h2>
                    <table id="attributeTable"></table>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.13.0/dist/leaflet-geoman.min.js"></script>
    <script src="https://unpkg.com/leaflet.browser.print/dist/leaflet.browser.print.min.js"></script>
    <script src="https://unpkg.com/leaflet-bookmarks@1.1.0/Leaflet.Bookmarks.min.js"></script>
    <script src="https://unpkg.com/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
        // Global variables
        let map;
        let layers = [];
        let selectedLayers = new Set();
        let mapLayers = {};
        let baseLayer;
        let drawnItems;
        let drawControl;
        let measureControl;
        let printControl;
        let bookmarksControl;
        let identifyActive = false;

        // Initialize map
        function initMap() {
            map = L.map('map', {
                rotate: true,
                touchRotate: true,
                rotateControl: {
                    closeOnZeroBearing: false
                },
                zoomControl: false // Disable default zoom to position custom
            }).setView([35.6892, 51.3890], 8);

            // Custom base layer only
            baseLayer = L.tileLayer('http://localhost:8000/api/v1/direct-tms/tables/turkaman_map/{z}/{x}/{y}.png', {opacity: 0.7}).addTo(map);

            // Add custom zoom control below toolbar
            L.control.zoom({position: 'topleft'}).addTo(map);

            // Add rotate control
            L.control.rotate({position: 'topleft'}).addTo(map);

            // Add scale control
            L.control.scale({position: 'bottomright'}).addTo(map);

            // Drawing layer
            drawnItems = L.featureGroup().addTo(map);
            drawControl = new L.Control.Draw({
                draw: {
                    marker: true,
                    polyline: true,
                    polygon: true,
                    rectangle: true,
                    circle: false,
                    circlemarker: false,
                    text: true // For annotation
                },
                edit: {
                    featureGroup: drawnItems
                }
            });

            // Measure (using Geoman for better measurement)
            map.pm.addControls({
                position: 'topleft',
                drawControls: false,
                editControls: false,
                optionsControls: false,
                customControls: true
            });
            // Adjust measure panel position via JS since CSS margin-top may not work
            const pmToolbar = document.querySelector('.leaflet-pm-toolbar');
            if (pmToolbar) {
                pmToolbar.style.marginTop = '150px';
            }

            // Print
            printControl = L.browserPrint({
                title: 'Print Map',
                printModes: ['Landscape', 'Portrait']
            }).addTo(map);

            // Bookmarks
            bookmarksControl = new L.Control.Bookmarks({position: 'topright'}).addTo(map);

            // Events
            map.on('mousemove', updateStatus);
            map.on('moveend', updateStatus);
            map.on('zoomend', updateStatus);
            map.on('click', handleIdentify);

            // Load layers
            loadLayers();
            updateStatus(); // Initial update
        }
        

        // Load layers (same as before, with enhancements)
        async function loadLayers() {
            try {
                showLoading(true);
                const response = await fetch('http://localhost:8000/api/v1/database/layers', {timeout: 10000});
                if (!response.ok) throw new Error('Error loading layers');
                layers = await response.json();
                renderLayerList();
                showNotification(layers.length + ' layers loaded', 'success');
            } catch (error) {
                showNotification('Error loading layers: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // Render layer list with opacity and actions
        function renderLayerList() {
            const layerList = document.getElementById('layerList');
            layerList.innerHTML = layers.map(layer => `
                <div class="layer-item" data-id="${layer.id}">
                    <input type="checkbox" class="layer-checkbox" id="layer-${layer.id}" ${selectedLayers.has(layer.id) ? 'checked' : ''} onchange="toggleLayer(${layer.id})" ${layer.is_active ? '' : 'disabled'}>
                    <div class="layer-info">${layer.title || layer.name}</div>
                    <input type="range" class="opacity-slider" min="0" max="1" step="0.01" value="0.8" onchange="setLayerOpacity(${layer.id}, this.value)">
                    <div class="layer-actions">
                        <button class="action-btn" onclick="showAttributeTable(${layer.id})" title="Attribute Table"><i class="fas fa-table"></i></button>
                    </div>
                </div>
            `).join('');

            // Make sortable
            Sortable.create(layerList, {
                handle: '.layer-item',
                onEnd: updateLayerOrder
            });
        }

        // Toggle layer
        function toggleLayer(layerId) {
            const layer = layers.find(l => l.id === layerId);
            const checkbox = document.getElementById(`layer-${layerId}`);
            if (checkbox.checked) {
                selectedLayers.add(layerId);
                addLayerToMap(layer);
            } else {
                selectedLayers.delete(layerId);
                removeLayerFromMap(layerId);
            }
            updateStatus();
        }

        // Add layer to map
        function addLayerToMap(layer) {
            const tmsLayer = L.tileLayer(`http://localhost:8000/api/v1/direct-tms/tables/${layer.table_name}/{z}/{x}/{y}.png`, {
                minZoom: layer.min_zoom || 0,
                maxZoom: layer.max_zoom || 18,
                opacity: 0.8
            }).addTo(map);
            mapLayers[layer.id] = tmsLayer;
        }

        // Remove layer from map
        function removeLayerFromMap(layerId) {
            if (mapLayers[layerId]) {
                map.removeLayer(mapLayers[layerId]);
                delete mapLayers[layerId];
            }
        }

        // Set layer opacity
        function setLayerOpacity(layerId, opacity) {
            if (mapLayers[layerId]) {
                mapLayers[layerId].setOpacity(opacity);
            }
        }

        // Update layer order (z-index)
        function updateLayerOrder() {
            const items = document.querySelectorAll('.layer-item');
            Array.from(items).reverse().forEach((item, index) => {
                const layerId = parseInt(item.dataset.id);
                if (mapLayers[layerId]) {
                    mapLayers[layerId].setZIndex(index + 1);
                }
            });
        }

        // Select all
        function selectAllLayers() {
            layers.forEach(layer => {
                if (layer.is_active) {
                    selectedLayers.add(layer.id);
                    document.getElementById(`layer-${layer.id}`).checked = true;
                    addLayerToMap(layer);
                }
            });
            updateStatus();
        }

        // Deselect all
        function deselectAllLayers() {
            selectedLayers.forEach(id => removeLayerFromMap(id));
            selectedLayers.clear();
            layers.forEach(layer => {
                if (document.getElementById(`layer-${layer.id}`)) document.getElementById(`layer-${layer.id}`).checked = false;
            });
            updateStatus();
        }

        // Toggle measure (using Geoman measure)
        function toggleMeasure() {
            map.pm.toggleControls();
        }

        // Toggle draw
        function toggleDraw() {
            if (map.hasControl(drawControl)) {
                map.removeControl(drawControl);
            } else {
                map.addControl(drawControl);
            }
        }

        // Print map
        function printMap() {
            printControl.print();
        }

        // Toggle identify
        function toggleIdentify() {
            identifyActive = !identifyActive;
            showNotification(identifyActive ? 'Identify mode activated' : 'Identify mode deactivated', 'info');
        }

        // Handle identify click
        function handleIdentify(e) {
            if (identifyActive) {
                // Placeholder: Query backend or show coord
                // Assume endpoint /api/v1/query?lat={lat}&lng={lng}
                fetch(`http://localhost:8000/api/v1/query?lat=${e.latlng.lat}&lng=${e.latlng.lng}`)
                    .then(res => res.json())
                    .then(data => {
                        L.popup().setLatLng(e.latlng).setContent(JSON.stringify(data || {message: 'No features found'})).openOn(map);
                    })
                    .catch(() => {
                        L.popup().setLatLng(e.latlng).setContent('Coordinates: ' + e.latlng).openOn(map);
                    });
            }
        }

        // Show attribute table (placeholder, assume endpoint /api/v1/tables/{table_name})
        async function showAttributeTable(layerId) {
            const layer = layers.find(l => l.id === layerId);
            try {
                const res = await fetch(`http://localhost:8000/api/v1/tables/${layer.table_name}`);
                const data = await res.json();
                const table = document.getElementById('attributeTable');
                if (data.length > 0) {
                    const headers = Object.keys(data[0]);
                    table.innerHTML = `<thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${data.map(row => `<tr>${headers.map(h => `<td>${row[h]}</td>`).join('')}</tr>`).join('')}</tbody>`;
                } else {
                    table.innerHTML = '<tr><td>No data</td></tr>';
                }
                document.getElementById('attributeModal').style.display = 'block';
            } catch (error) {
                showNotification('Error loading attributes', 'error');
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('attributeModal').style.display = 'none';
        }

        // Reset map
        function resetMapView() {
            map.setView([35.6892, 51.3890], 8);
            map.setBearing(0);
        }

        // Update status bar
        function updateStatus(e) {
            let lat, lng;
            if (e && e.latlng) {
                lat = e.latlng.lat;
                lng = e.latlng.lng;
            } else {
                const center = map.getCenter();
                lat = center.lat;
                lng = center.lng;
            }
            document.getElementById('coordinates').textContent = `Coordinate: ${lng.toFixed(6)}, ${lat.toFixed(6)}`;

            const zoom = map.getZoom();
            document.getElementById('zoomLevel').textContent = `Magnifier: ${zoom}`;

            // Scale approximate
            const scale = Math.round(156543.03392804062 / Math.pow(2, zoom) * 1000); // Approx meters
            document.getElementById('scale').textContent = `Scale: 1:${scale}`;
        }

        // Show loading
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // Show notification
        function showNotification(message, type = 'success') {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.className = `notification ${type}`;
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 3000);
        }

        // Init
        document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>

</html>
