<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug GIS Map</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.2.0/ol.css">
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 400px; border: 1px solid #ccc; }
        .info { margin: 10px 0; padding: 10px; background: #f0f0f0; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
    </style>
</head>
<body>
    <h1>Debug GIS Map</h1>
    <div id="map"></div>
    <div id="info" class="info">Loading...</div>
    
    <script src="https://cdn.jsdelivr.net/npm/ol@8.2.0/dist/ol.js"></script>
    <script>
        console.log('OpenLayers version:', ol.getVersion());
        console.log('OpenLayers available:', typeof ol);
        console.log('ol.control available:', typeof ol.control);
        console.log('ol.control.defaults available:', typeof ol.control.defaults);
        
        let map;
        let layers = [];
        
        async function testAPI() {
            try {
                console.log('Testing API...');
                const response = await fetch('http://localhost:8000/api/v1/database/layers');
                console.log('API Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }
                
                const data = await response.json();
                layers = Array.isArray(data) ? data : [];
                console.log('Loaded layers:', layers.length);
                console.log('First layer:', layers[0]);
                
                document.getElementById('info').innerHTML = 
                    `<div class="success">API Success: ${layers.length} layers loaded</div>`;
                
                return true;
            } catch (error) {
                console.error('API Error:', error);
                document.getElementById('info').innerHTML = 
                    `<div class="error">API Error: ${error.message}</div>`;
                return false;
            }
        }
        
        function initMap() {
            try {
                console.log('Initializing map...');
                
                map = new ol.Map({
                    target: 'map',
                    layers: [
                        new ol.layer.Tile({
                            title: 'OpenStreetMap',
                            source: new ol.source.OSM()
                        })
                    ],
                    view: new ol.View({
                        center: ol.proj.fromLonLat([51.3890, 35.6892]),
                        zoom: 8,
                        projection: 'EPSG:3857'
                    }),
                    controls: ol.control.defaults({
                        attribution: false
                    }).extend([
                        new ol.control.ScaleLine({
                            units: 'metric'
                        })
                    ])
                });
                
                console.log('Map initialized successfully');
                document.getElementById('info').innerHTML += 
                    '<div class="success">Map initialized successfully</div>';
                
                return true;
            } catch (error) {
                console.error('Map Error:', error);
                document.getElementById('info').innerHTML += 
                    `<div class="error">Map Error: ${error.message}</div>`;
                return false;
            }
        }
        
        async function testTMS() {
            if (layers.length === 0) {
                console.log('No layers to test TMS');
                return false;
            }
            
            try {
                const layer = layers[0];
                console.log('Testing TMS for layer:', layer);
                
                const tileUrl = `http://localhost:8000/api/v1/direct-tms/tables/${layer.table_name}/8/128/85.png`;
                console.log('Tile URL:', tileUrl);
                
                const response = await fetch(tileUrl);
                console.log('TMS Response status:', response.status);
                
                if (response.ok) {
                    console.log('TMS Success');
                    document.getElementById('info').innerHTML += 
                        '<div class="success">TMS Success: Tile loaded</div>';
                    return true;
                } else {
                    throw new Error(`TMS Error: ${response.status}`);
                }
            } catch (error) {
                console.error('TMS Error:', error);
                document.getElementById('info').innerHTML += 
                    `<div class="error">TMS Error: ${error.message}</div>`;
                return false;
            }
        }
        
        async function addLayerToMap() {
            if (layers.length === 0) {
                console.log('No layers to add');
                return false;
            }
            
            try {
                const layer = layers[0];
                console.log('Adding layer to map:', layer);
                
                const olLayer = new ol.layer.Tile({
                    id: layer.id,
                    title: layer.title || layer.name,
                    source: new ol.source.XYZ({
                        url: `http://localhost:8000/api/v1/direct-tms/tables/${layer.table_name}/{z}/{x}/{y}.png`,
                        projection: 'EPSG:3857'
                    }),
                    visible: true
                });
                
                map.addLayer(olLayer);
                console.log('Layer added to map successfully');
                document.getElementById('info').innerHTML += 
                    '<div class="success">Layer added to map successfully</div>';
                
                return true;
            } catch (error) {
                console.error('Add Layer Error:', error);
                document.getElementById('info').innerHTML += 
                    `<div class="error">Add Layer Error: ${error.message}</div>`;
                return false;
            }
        }
        
        // Run all tests
        async function runTests() {
            console.log('Starting tests...');
            
            const apiSuccess = await testAPI();
            if (!apiSuccess) return;
            
            const mapSuccess = initMap();
            if (!mapSuccess) return;
            
            const tmsSuccess = await testTMS();
            if (!tmsSuccess) return;
            
            const layerSuccess = await addLayerToMap();
            if (!layerSuccess) return;
            
            console.log('All tests completed successfully');
        }
        
        // Start tests when page loads
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
